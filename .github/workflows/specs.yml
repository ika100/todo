name: specs

# ADR-026: every spec is valid and every criterion of a built spec is named by a test.
# Warn-only for now (annotations on the PR); it becomes a required check in the next major.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spec-check:
    name: spec-check (warn-only)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: bash scripts/spec-check.sh
