name: specs

# ADR-026: every spec is valid and every criterion of a built spec is named by a test.
# Warn-only for now (annotations on the PR); it becomes a required check in the next major.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spec-check:
    name: spec-check (warn-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: bash scripts/spec-check.sh
