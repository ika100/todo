name: pin-dev

# Spec 062 / ADR-027: every merge to a service's main pins dev to that build. The service's CI sends
# `repository_dispatch` (event pin-dev, payload {service, tag}); this workflow pins the tag on a branch, opens a PR,
# runs ci.yml on it (PRs and pushes made with GITHUB_TOKEN start no workflows, workflow_dispatch does) and turns on
# auto-merge, so the PR merges once the required checks pass. A red CI leaves the PR open and dev on the old image.
on:
  repository_dispatch:
    types: [pin-dev]

permissions:
  contents: write        # push the pin branch
  pull-requests: write   # open, close superseded, enable auto-merge
  actions: write         # dispatch ci.yml on the pin branch

concurrency:
  group: pin-dev-${{ github.event.client_payload.service }}
  cancel-in-progress: false

jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Pin dev, open the PR, merge it after CI
        env:
          GH_TOKEN: ${{ github.token }}
          SERVICE: ${{ github.event.client_payload.service }}
          TAG: ${{ github.event.client_payload.tag }}
        run: |
          set -euo pipefail
          [[ "$SERVICE" =~ ^[a-z0-9][a-z0-9-]*$ ]] || { echo "::error::invalid service '$SERVICE'"; exit 1; }
          [[ "$TAG" =~ ^sha-[0-9a-f]{7}$ ]] || { echo "::error::invalid tag '$TAG' (expected sha-<7 hex>)"; exit 1; }
          uv run scripts/pin.py dev "$SERVICE" "$TAG"
          uv run scripts/render.py --check
          if git diff --quiet; then echo "::notice::dev already runs $SERVICE:$TAG"; exit 0; fi
          branch="pin/dev-$SERVICE-${TAG#sha-}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit --signoff -am "chore(dev): pin $SERVICE to $TAG"
          git push -u origin "$branch"
          url=$(gh pr create --base main --head "$branch" --title "chore(dev): pin $SERVICE to $TAG" \
            --body "Automatic pin of a new build of \`$SERVICE\`'s main (spec 062). Merges itself when CI passes; if CI fails, dev keeps the previous image.")
          for old in $(gh pr list --state open --json number,headRefName \
              --jq ".[] | select(.headRefName | startswith(\"pin/dev-$SERVICE-\")) | select(.headRefName != \"$branch\") | .number"); do
            gh pr close "$old" --delete-branch --comment "Superseded by $url" || true
          done
          gh workflow run ci.yml --ref "$branch"
          gh pr merge "$url" --auto --squash --delete-branch
