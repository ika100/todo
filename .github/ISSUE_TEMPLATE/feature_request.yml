name: Feature request
description: Suggest new behaviour or an improvement
labels: [triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can you not do today, and why does it matter?
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: What should happen instead? Examples help.
    validations: {required: true}
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
