# Registry of the services that make up the todo application (ADR-014, ADR-017).
# Edit with `/gitops:compose add|remove <service>` and `/gitops:promote`; then `devbox run render` regenerates the
# ApplicationSets and every Kubernetes manifest under overlays/. Every repo listed here must carry the
# `deployable-service` GitHub topic. This repo owns ALL manifests: services only ship an image.
#
# A service is rendered only for the environments in `environments` (new services start in dev; `/gitops:promote` adds the next).
services:
  - name: todo-api
    repo: ika100/todo-api
    shape: service-python
    image: ghcr.io/ika100/todo-api
    port: 8080
    probes:
      liveness: /health
      readiness: /ready
    user: 10001
    metrics: /metrics
    volumes:
      tmp: /tmp
    env:
      LOG_LEVEL: INFO
    uses:
      - postgres
    secretRefs: []
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    environments:
      - dev
  - name: todo-web
    repo: ika100/todo-web
    shape: web-nextjs
    image: ghcr.io/ika100/todo-web
    port: 3000
    probes:
      liveness: /api/health
      readiness: /api/ready
    user: 1000
    metrics: /api/metrics
    volumes:
      tmp: /tmp
      next-cache: /app/.next/cache
    env:
      NODE_ENV: production
      TODO_API_URL: http://todo-api
    secretRefs: []
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 192Mi
      limits:
        cpu: 1000m
        memory: 512Mi
    expose:
      host: todo-web
    environments:
      - dev
