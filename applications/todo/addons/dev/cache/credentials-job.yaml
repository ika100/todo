apiVersion: batch/v1
kind: Job
metadata:
  name: todo-cache-credentials-244556fd
  labels:
    app.kubernetes.io/name: cache
    app.kubernetes.io/part-of: todo
    app.kubernetes.io/managed-by: gitops-app
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: '1'
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: todo-cache-credentials
        app.kubernetes.io/part-of: todo
        app.kubernetes.io/managed-by: gitops-app
        app.kubernetes.io/component: credentials
    spec:
      serviceAccountName: todo-cache-credentials
      automountServiceAccountToken: true
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: credentials
        image: python:3.13.18-alpine3.24@sha256:7984cf56ceaddebe4fefeb75d64000b9f45d8b77b11a09b24524da6cdc3af0c8
        command:
        - python3
        - /credentials/create.py
        - /credentials/plan.json
        env:
        - name: PYTHONDONTWRITEBYTECODE
          value: '1'
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 64Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: credentials
          mountPath: /credentials
          readOnly: true
      volumes:
      - name: credentials
        configMap:
          name: todo-cache-credentials
