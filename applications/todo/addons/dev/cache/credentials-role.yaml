apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: todo-cache-credentials
  labels:
    app.kubernetes.io/name: cache
    app.kubernetes.io/part-of: todo
    app.kubernetes.io/managed-by: gitops-app
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: '0'
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
rules:
- apiGroups:
  - ''
  resources:
  - secrets
  verbs:
  - create
- apiGroups:
  - ''
  resources:
  - secrets
  resourceNames:
  - todo-cache-app
  verbs:
  - get
  - patch
- apiGroups:
  - external-secrets.io
  resources:
  - externalsecrets
  resourceNames:
  - todo-cache-app
  verbs:
  - get
  - delete
- apiGroups:
  - generators.external-secrets.io
  resources:
  - passwords
  resourceNames:
  - todo-cache-password
  verbs:
  - delete
- apiGroups:
  - ''
  resources:
  - pods
  resourceNames:
  - todo-cache-0
  verbs:
  - get
  - delete
