apiVersion: v1
kind: ConfigMap
metadata:
  name: todo-cache-credentials
  labels:
    app.kubernetes.io/name: cache
    app.kubernetes.io/part-of: todo
    app.kubernetes.io/managed-by: gitops-app
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: '0'
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
data:
  create.py: "# The credentials Job (spec 128): writes each generated credential once\
    \ (create if absent, otherwise keep what exists),\n# retires the 5.4 ExternalSecrets\
    \ and Password generators, and restarts a server that refuses the password of\
    \ its Secret.\n# Standard library only. No value is ever printed.\nimport base64\n\
    import json\nimport os\nimport re\nimport secrets\nimport socket\nimport ssl\n\
    import sys\nimport time\nimport urllib.error\nimport urllib.request\n\nALPHABET\
    \ = \"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789\"\nPLACEHOLDER\
    \ = re.compile(r\"\\{\\{ \\.([A-Za-z0-9_]+) \\}\\}\")\nSA_DIR = os.environ.get(\"\
    CREDENTIALS_SA_DIR\", \"/var/run/secrets/kubernetes.io/serviceaccount\")\nAPI\
    \ = os.environ.get(\"CREDENTIALS_API_URL\") or \"https://%s:%s\" % (\n    os.environ.get(\"\
    KUBERNETES_SERVICE_HOST\", \"kubernetes.default.svc\"), os.environ.get(\"KUBERNETES_SERVICE_PORT\"\
    , \"443\"))\nRETRY_SECONDS = 60\n\n\nclass Fail(Exception):\n    def __init__(self,\
    \ message, code=1):\n        Exception.__init__(self, message)\n        self.code\
    \ = code\n\n\ndef log(message):\n    print(message, flush=True)\n\n\nwith open(os.path.join(SA_DIR,\
    \ \"token\")) as handle:\n    TOKEN = handle.read().strip()\nCONTEXT = None\n\
    if API.startswith(\"https://\"):\n    CONTEXT = ssl.create_default_context(cafile=os.path.join(SA_DIR,\
    \ \"ca.crt\"))\n\n\ndef call(method, path, body=None, content_type=\"application/json\"\
    ):\n    \"\"\"One API request; connection errors, 403, 429 and 5xx are retried\
    \ with backoff for up to 60 s. Returns (status, object).\"\"\"\n    data = None\
    \ if body is None else json.dumps(body).encode()\n    deadline = time.time() +\
    \ RETRY_SECONDS\n    delay = 0.5\n    while True:\n        request = urllib.request.Request(API\
    \ + path, data=data, method=method)\n        request.add_header(\"Authorization\"\
    , \"Bearer \" + TOKEN)\n        request.add_header(\"Accept\", \"application/json\"\
    )\n        if data is not None:\n            request.add_header(\"Content-Type\"\
    , content_type)\n        status, raw = None, b\"\"\n        try:\n           \
    \ with urllib.request.urlopen(request, timeout=30, context=CONTEXT) as response:\n\
    \                status, raw = response.status, response.read()\n        except\
    \ urllib.error.HTTPError as error:\n            status, raw = error.code, error.read()\n\
    \        except (urllib.error.URLError, OSError):\n            status = None\n\
    \        if status is not None and status != 403 and status != 429 and status\
    \ < 500:\n            try:\n                return status, (json.loads(raw) if\
    \ raw else None)\n            except ValueError:\n                return status,\
    \ None\n        if time.time() + delay > deadline:\n            raise Fail(\"\
    %s %s: %s\" % (method, path, \"no answer\" if status is None else \"status %d\"\
    \ % status))\n        time.sleep(delay)\n        delay = min(delay * 2, 5)\n\n\
    \ndef expect(status, wanted, method, path):\n    if status not in wanted:\n  \
    \      raise Fail(\"%s %s: unexpected status %d\" % (method, path, status))\n\n\
    \ndef retire(plan):\n    ns = plan[\"namespace\"]\n    for name in plan.get(\"\
    retire\", {}).get(\"externalSecrets\", []):\n        path = \"/apis/external-secrets.io/v1/namespaces/%s/externalsecrets/%s\"\
    \ % (ns, name)\n        status, obj = call(\"GET\", path)\n        if status ==\
    \ 404:\n            continue\n        expect(status, (200,), \"GET\", path)\n\
    \        sources = (obj.get(\"spec\") or {}).get(\"dataFrom\") or []\n       \
    \ if not any((source.get(\"sourceRef\") or {}).get(\"generatorRef\") for source\
    \ in sources):\n            raise Fail(\"ExternalSecret %s is not generator-backed;\
    \ it writes this Secret, so the credentials Job does not\" % name)\n        status,\
    \ _ = call(\"DELETE\", path, {\"apiVersion\": \"v1\", \"kind\": \"DeleteOptions\"\
    , \"propagationPolicy\": \"Orphan\"})\n        if status != 404:\n           \
    \ expect(status, (200, 202), \"DELETE\", path)\n        deadline = time.time()\
    \ + 60\n        while True:\n            status, _ = call(\"GET\", path)\n   \
    \         if status == 404:\n                break\n            if time.time()\
    \ > deadline:\n                raise Fail(\"ExternalSecret %s is still there 60\
    \ s after its deletion\" % name)\n            time.sleep(0.5)\n        log(\"\
    retired ExternalSecret \" + name)\n    for name in plan.get(\"retire\", {}).get(\"\
    generators\", []):\n        path = \"/apis/generators.external-secrets.io/v1alpha1/namespaces/%s/passwords/%s\"\
    \ % (ns, name)\n        status, _ = call(\"DELETE\", path)\n        if status\
    \ != 404:\n            expect(status, (200, 202), \"DELETE\", path)\n        \
    \    log(\"retired Password generator \" + name)\n\n\ndef generate(length):\n\
    \    return \"\".join(secrets.choice(ALPHABET) for _ in range(length))\n\n\ndef\
    \ render(value, values):\n    return PLACEHOLDER.sub(lambda match: values[match.group(1)],\
    \ value)\n\n\ndef encode(value):\n    return base64.b64encode(value.encode()).decode()\n\
    \n\ndef pointer(key):\n    return key.replace(\"~\", \"~0\").replace(\"/\", \"\
    ~1\")\n\n\ndef build_patch(entry, current):\n    \"\"\"The JSON patch that keeps\
    \ every existing value and fixes only metadata and missing keys; returns (ops,\
    \ added, adopted).\"\"\"\n    meta = current[\"metadata\"]\n    ops = [{\"op\"\
    : \"test\", \"path\": \"/metadata/resourceVersion\", \"value\": meta[\"resourceVersion\"\
    ]}]\n    adopted = False\n    declared = entry.get(\"labels\") or {}\n    labels\
    \ = meta.get(\"labels\")\n    if declared and labels is None:\n        ops.append({\"\
    op\": \"add\", \"path\": \"/metadata/labels\", \"value\": dict(declared)})\n \
    \       adopted = True\n    else:\n        for key, value in sorted(declared.items()):\n\
    \            if (labels or {}).get(key) != value:\n                ops.append({\"\
    op\": \"add\", \"path\": \"/metadata/labels/\" + pointer(key), \"value\": value})\n\
    \                adopted = True\n    if \"app.kubernetes.io/instance\" in (labels\
    \ or {}):\n        ops.append({\"op\": \"remove\", \"path\": \"/metadata/labels/app.kubernetes.io~1instance\"\
    })\n        adopted = True\n    if \"argocd.argoproj.io/tracking-id\" in (meta.get(\"\
    annotations\") or {}):\n        ops.append({\"op\": \"remove\", \"path\": \"/metadata/annotations/argocd.argoproj.io~1tracking-id\"\
    })\n        adopted = True\n    refs = meta.get(\"ownerReferences\") or []\n \
    \   kept = [ref for ref in refs if ref.get(\"kind\") != \"ExternalSecret\"]\n\
    \    if len(kept) != len(refs):\n        if kept:\n            ops.append({\"\
    op\": \"replace\", \"path\": \"/metadata/ownerReferences\", \"value\": kept})\n\
    \        else:\n            ops.append({\"op\": \"remove\", \"path\": \"/metadata/ownerReferences\"\
    })\n        adopted = True\n    existing = current.get(\"data\")\n    have = dict(existing\
    \ or {})\n    values = {}\n    for key in entry.get(\"generate\", {}):\n     \
    \   if key in have:\n            values[key] = base64.b64decode(have[key]).decode()\n\
    \    added = []\n    for key, length in sorted(entry.get(\"generate\", {}).items()):\n\
    \        if key not in have:\n            values[key] = generate(length)\n   \
    \         added.append(key)\n    for key, literal in sorted(entry.get(\"data\"\
    , {}).items()):\n        if key not in have:\n            added.append(key)\n\
    \    if added:\n        new = {}\n        for key in added:\n            if key\
    \ in entry.get(\"generate\", {}):\n                new[key] = encode(values[key])\n\
    \            else:\n                new[key] = encode(render(entry[\"data\"][key],\
    \ values))\n        if existing is None:\n            ops.append({\"op\": \"add\"\
    , \"path\": \"/data\", \"value\": new})\n        else:\n            for key in\
    \ sorted(new):\n                ops.append({\"op\": \"add\", \"path\": \"/data/\"\
    \ + pointer(key), \"value\": new[key]})\n    return ops, sorted(added), adopted\n\
    \n\ndef keep(ns, entry):\n    name = entry[\"name\"]\n    path = \"/api/v1/namespaces/%s/secrets/%s\"\
    \ % (ns, name)\n    for _ in range(5):\n        status, current = call(\"GET\"\
    , path)\n        expect(status, (200,), \"GET\", path)\n        ops, added, adopted\
    \ = build_patch(entry, current)\n        if len(ops) == 1:\n            log(\"\
    kept \" + name)\n            return\n        status, _ = call(\"PATCH\", path,\
    \ ops, \"application/json-patch+json\")\n        if status in (409, 422):\n  \
    \          continue\n        expect(status, (200,), \"PATCH\", path)\n       \
    \ note = \"kept \" + name\n        if added:\n            note += \"; added keys\
    \ \" + \",\".join(added)\n        if adopted:\n            note += \"; adopted\
    \ (metadata)\"\n        log(note)\n        return\n    raise Fail(\"PATCH %s:\
    \ still conflicting after 5 attempts\" % path)\n\n\ndef write_secrets(plan):\n\
    \    ns = plan[\"namespace\"]\n    for entry in plan[\"secrets\"]:\n        values\
    \ = {key: generate(length) for key, length in entry.get(\"generate\", {}).items()}\n\
    \        data = dict(values)\n        for key, literal in entry.get(\"data\",\
    \ {}).items():\n            data[key] = render(literal, values)\n        body\
    \ = {\"apiVersion\": \"v1\", \"kind\": \"Secret\", \"type\": \"Opaque\",\n   \
    \             \"metadata\": {\"name\": entry[\"name\"], \"namespace\": ns, \"\
    labels\": entry.get(\"labels\") or {}},\n                \"data\": {key: encode(value)\
    \ for key, value in sorted(data.items())}}\n        path = \"/api/v1/namespaces/%s/secrets\"\
    \ % ns\n        status, _ = call(\"POST\", path, body)\n        if status == 201:\n\
    \            log(\"created \" + entry[\"name\"])\n        elif status == 409:\n\
    \            keep(ns, entry)\n        else:\n            expect(status, (201,),\
    \ \"POST\", path)\n\n\ndef read_line(sock):\n    buf = b\"\"\n    while b\"\\\
    n\" not in buf:\n        chunk = sock.recv(4096)\n        if not chunk:\n    \
    \        break\n        buf += chunk\n    return buf\n\n\ndef probe_valkey(ip,\
    \ port, user, password):\n    try:\n        with socket.create_connection((ip,\
    \ port), timeout=5) as sock:\n            sock.settimeout(5)\n            parts\
    \ = [b\"AUTH\", user.encode(), password.encode()]\n            sock.sendall(b\"\
    *3\\r\\n\" + b\"\".join(b\"$%d\\r\\n%s\\r\\n\" % (len(part), part) for part in\
    \ parts))\n            reply = read_line(sock)\n    except OSError:\n        return\
    \ \"unknown\"\n    if reply.startswith(b\"+OK\"):\n        return \"accepted\"\
    \n    if reply.startswith(b\"-WRONGPASS\"):\n        return \"refused\"\n    return\
    \ \"unknown\"\n\n\ndef probe_nats(ip, port, user, password):\n    try:\n     \
    \   with socket.create_connection((ip, port), timeout=5) as sock:\n          \
    \  sock.settimeout(5)\n            info = read_line(sock)\n            if b'\"\
    tls_required\":true' in info.replace(b\" \", b\"\"):\n                return \"\
    unknown\"\n            options = {\"verbose\": False, \"pedantic\": False, \"\
    user\": user, \"pass\": password, \"name\": \"credentials-check\",\n         \
    \              \"lang\": \"python\", \"version\": \"1\", \"protocol\": 1}\n  \
    \          sock.sendall(b\"CONNECT \" + json.dumps(options).encode() + b\"\\r\\\
    nPING\\r\\n\")\n            buf = b\"\"\n            while b\"PONG\" not in buf\
    \ and b\"-ERR\" not in buf:\n                chunk = sock.recv(4096)\n       \
    \         if not chunk:\n                    break\n                buf += chunk\n\
    \    except OSError:\n        return \"unknown\"\n    if b\"PONG\" in buf:\n \
    \       return \"accepted\"\n    if b\"Authorization Violation\" in buf:\n   \
    \     return \"refused\"\n    return \"unknown\"\n\n\ndef ready(pod):\n    conditions\
    \ = (pod.get(\"status\") or {}).get(\"conditions\") or []\n    return any(c.get(\"\
    type\") == \"Ready\" and c.get(\"status\") == \"True\" for c in conditions)\n\n\
    \ndef get_pod(ns, name):\n    path = \"/api/v1/namespaces/%s/pods/%s\" % (ns,\
    \ name)\n    status, pod = call(\"GET\", path)\n    if status == 404:\n      \
    \  return None\n    expect(status, (200,), \"GET\", path)\n    return pod\n\n\n\
    def secret_value(ns, name, key):\n    path = \"/api/v1/namespaces/%s/secrets/%s\"\
    \ % (ns, name)\n    status, obj = call(\"GET\", path)\n    expect(status, (200,),\
    \ \"GET\", path)\n    return base64.b64decode((obj.get(\"data\") or {})[key]).decode()\n\
    \n\ndef declared_users(pod, users):\n    \"\"\"The users whose password variable\
    \ this pod declares from the planned Secret.\"\"\"\n    found = []\n    for user\
    \ in users:\n        for container in (pod.get(\"spec\") or {}).get(\"containers\"\
    ) or []:\n            for var in container.get(\"env\") or []:\n             \
    \   ref = (var.get(\"valueFrom\") or {}).get(\"secretKeyRef\") or {}\n       \
    \         if var.get(\"name\") == user[\"env\"] and ref.get(\"name\") == user[\"\
    secret\"]:\n                    found.append(user)\n    return found\n\n\ndef\
    \ probe_pod(ns, verify, pod, users):\n    probe = probe_valkey if verify[\"engine\"\
    ] == \"valkey\" else probe_nats\n    states = []\n    for user in users:\n   \
    \     password = secret_value(ns, user[\"secret\"], user[\"key\"])\n        states.append((user,\
    \ probe(pod[\"status\"][\"podIP\"], verify[\"port\"], user[\"user\"], password)))\n\
    \    return states\n\n\ndef verify_servers(plan):\n    verify = plan.get(\"verify\"\
    )\n    if not verify:\n        return\n    ns = plan[\"namespace\"]\n    checked\
    \ = {}\n    refused = {}\n    for name in verify[\"pods\"]:\n        pod = get_pod(ns,\
    \ name)\n        if pod is None:\n            log(\"skipped %s: no such pod\"\
    \ % name)\n        elif not ready(pod):\n            log(\"skipped %s: not ready\"\
    \ % name)\n        elif not (pod.get(\"status\") or {}).get(\"podIP\"):\n    \
    \        log(\"skipped %s: no pod IP\" % name)\n        else:\n            users\
    \ = declared_users(pod, verify[\"users\"])\n            states = probe_pod(ns,\
    \ verify, pod, users)\n            checked[name] = (pod, users)\n            bad\
    \ = [user for user, state in states if state == \"refused\"]\n            if bad:\n\
    \                refused[name] = bad\n            elif states and all(state ==\
    \ \"accepted\" for _, state in states):\n                log(\"verified \" + name)\n\
    \            elif states:\n                log(\"skipped %s: could not check every\
    \ password\" % name)\n    for name, bad in sorted(refused.items()):\n        path\
    \ = \"/api/v1/namespaces/%s/pods/%s\" % (ns, name)\n        status, _ = call(\"\
    DELETE\", path)\n        expect(status, (200, 202, 404), \"DELETE\", path)\n \
    \       for user in bad:\n            log(\"restarted %s: it refused the password\
    \ of %s\" % (name, user[\"secret\"]))\n    for name, bad in sorted(refused.items()):\n\
    \        old_uid = checked[name][0][\"metadata\"][\"uid\"]\n        deadline =\
    \ time.time() + 120\n        fresh = None\n        while time.time() < deadline:\n\
    \            pod = get_pod(ns, name)\n            if pod and pod[\"metadata\"\
    ][\"uid\"] != old_uid and ready(pod) and (pod.get(\"status\") or {}).get(\"podIP\"\
    ):\n                fresh = pod\n                break\n            time.sleep(2)\n\
    \        if fresh is None:\n            log(\"skipped %s: not ready 120 s after\
    \ the restart\" % name)\n            continue\n        states = probe_pod(ns,\
    \ verify, fresh, checked[name][1])\n        again = [user for user, state in states\
    \ if state == \"refused\"]\n        if again:\n            for user in again:\n\
    \                log(\"%s still refuses the password of %s after a restart\" %\
    \ (name, user[\"secret\"]))\n            raise Fail(\"a server still refuses a\
    \ password after its restart\", 2)\n        log(\"verified \" + name)\n\n\ndef\
    \ main():\n    with open(sys.argv[1]) as handle:\n        plan = json.load(handle)\n\
    \    retire(plan)\n    write_secrets(plan)\n    verify_servers(plan)\n\n\ntry:\n\
    \    main()\nexcept Fail as failure:\n    log(str(failure))\n    sys.exit(failure.code)\n"
  plan.json: "{\n  \"namespace\": \"todo-dev\",\n  \"retire\": {\n    \"externalSecrets\"\
    : [\n      \"todo-cache-app\"\n    ],\n    \"generators\": [\n      \"todo-cache-password\"\
    \n    ]\n  },\n  \"secrets\": [\n    {\n      \"data\": {\n        \"host\": \"\
    todo-cache.todo-dev.svc\",\n        \"port\": \"6379\",\n        \"url\": \"redis://default:{{\
    \ .password }}@todo-cache.todo-dev.svc:6379/0\"\n      },\n      \"generate\"\
    : {\n        \"password\": 32\n      },\n      \"labels\": {\n        \"app.kubernetes.io/managed-by\"\
    : \"gitops-app\",\n        \"app.kubernetes.io/name\": \"cache\",\n        \"\
    app.kubernetes.io/part-of\": \"todo\"\n      },\n      \"name\": \"todo-cache-app\"\
    \n    }\n  ],\n  \"verify\": {\n    \"engine\": \"valkey\",\n    \"pods\": [\n\
    \      \"todo-cache-0\"\n    ],\n    \"port\": 6379,\n    \"users\": [\n     \
    \ {\n        \"env\": \"VALKEY_PASSWORD\",\n        \"key\": \"password\",\n \
    \       \"secret\": \"todo-cache-app\",\n        \"user\": \"default\"\n     \
    \ }\n    ]\n  }\n}"
