apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: todo-postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: todo
    app.kubernetes.io/managed-by: gitops-app
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17
  storage:
    size: 1Gi
  enableSuperuserAccess: false
  bootstrap:
    initdb:
      database: todo
      owner: todo
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
